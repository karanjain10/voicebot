<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VoiceBot</title>
<style>
:root{--bg:#f6f4ef;--fg:#1c1b19;--card:#fff;--accent:#0b6e4f;--muted:#6b675f}
@media(prefers-color-scheme:dark){:root{--bg:#161614;--fg:#eceae4;--card:#222220;--accent:#4cc59b;--muted:#9a968c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:640px;padding:24px 16px}
h1{margin:0 0 4px}p.sub{margin:0 0 16px;color:var(--muted)}
#log{background:var(--card);border-radius:12px;padding:12px;height:50vh;overflow:auto;display:flex;flex-direction:column;gap:8px}
.m{max-width:85%;padding:8px 12px;border-radius:12px}.u{align-self:flex-end;background:var(--accent);color:#fff}.b{align-self:flex-start;background:var(--bg)}
.m small{display:block;opacity:.7;font-size:12px}
#bar{display:flex;gap:8px;margin-top:12px}
input{flex:1;padding:10px;border-radius:8px;border:1px solid var(--muted);background:var(--card);color:var(--fg);font:inherit}
button{padding:10px 16px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:inherit;cursor:pointer}
button.rec{background:#c0392b}
#status{color:var(--muted);min-height:1.5em;margin-top:8px}
</style></head><body><main>
<h1>VoiceBot</h1>
<p class="sub">Press the mic and speak. Speech → text → neural network intent → reply.</p>
<div id="log" aria-live="polite"></div>
<div id="status"></div>
<div id="bar">
  <button id="mic" aria-label="Speak">🎤 Speak</button>
  <input id="txt" placeholder="…or type here" aria-label="Type a message">
  <button id="send">Send</button>
</div>
</main>
<script>
const $=id=>document.getElementById(id),log=$("log"),status=$("status");
function add(cls,text,note){const d=document.createElement("div");d.className="m "+cls;d.textContent=text;
  if(note){const s=document.createElement("small");s.textContent=note;d.append(s)}log.append(d);log.scrollTop=log.scrollHeight}
async function ask(text){
  if(!text.trim())return;add("u",text);
  try{const r=await(await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text})})).json();
    add("b",r.response,`intent: ${r.intent} · confidence ${(r.confidence*100).toFixed(0)}%`);
    speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(r.response));
  }catch(e){add("b","Server unreachable.")}
}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){$("mic").disabled=true;status.textContent="Speech recognition isn't supported in this browser. Use Chrome, Edge or Safari, or type."}
else{
  const rec=new SR();rec.lang="en-US";rec.interimResults=true;let final="";
  rec.onstart=()=>{$("mic").classList.add("rec");$("mic").textContent="⏹ Listening…";final=""};
  rec.onresult=e=>{let t="";for(const r of e.results)t+=r[0].transcript;final=t;status.textContent="Heard: "+t};
  rec.onerror=e=>status.textContent="Mic error: "+e.error;
  rec.onend=()=>{$("mic").classList.remove("rec");$("mic").textContent="🎤 Speak";if(final)ask(final)};
  $("mic").onclick=()=>{try{$("mic").classList.contains("rec")?rec.stop():rec.start()}catch(e){}};
}
$("send").onclick=()=>{ask($("txt").value);$("txt").value=""};
$("txt").onkeydown=e=>{if(e.key==="Enter")$("send").click()};
</script></body></html>
